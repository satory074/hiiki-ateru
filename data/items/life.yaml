  # --- 見始めた年代を見分ける暮らしの質問（2026-11-27 grilling で足した。Claude の下書き・オーナー確認待ち） ---
  # probs は手で置いた初期値（実測ではない）。見始めた年代（"1990"=1990年代以前／"2000"／"2010"／"2020"）ごとと、
  # 野球を見ない人（none）の答え方。どの質問にも「野球はあまり見ない」を入れる（見る前提を押しつけない）。
  - id: life-era-results
    kind: eralife
    genre: life
    text: 見始めたころ、前の日の試合結果は主に何で知った？
    options: [翌朝の新聞やテレビ, ネットのニュースや速報サイト, スマホのアプリやSNS, 覚えていない, 野球はあまり見ない]
    probs:
      "1990": [0.76, 0.08, 0.02, 0.13, 0.01]
      "2000": [0.45, 0.37, 0.05, 0.12, 0.01]
      "2010": [0.15, 0.34, 0.39, 0.11, 0.01]
      "2020": [0.06, 0.17, 0.67, 0.09, 0.01]
      none: [0.04, 0.03, 0.04, 0.09, 0.8]
    source: "https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/h29/html/nc111110.html"
    check: owner
    note: 世帯のスマートフォン保有率は 2011年末 29.3%・2013年末 62.6%・2016年末 71.8%（総務省 情報通信白書・通信利用動向調査）。2010年代に「アプリ・SNS」が主になる前提で置いた

  - id: life-era-broadcast
    kind: eralife
    genre: life
    text: 初めてよく見た野球中継は？
    options: [地上波のナイター中継, BS・CS の中継, ネット配信, 中継より球場やラジオ, 野球はあまり見ない]
    probs:
      "1990": [0.8, 0.05, 0.01, 0.13, 0.01]
      "2000": [0.55, 0.29, 0.03, 0.12, 0.01]
      "2010": [0.3, 0.37, 0.2, 0.12, 0.01]
      "2020": [0.15, 0.19, 0.55, 0.1, 0.01]
      none: [0.12, 0.02, 0.03, 0.03, 0.8]
    source: "https://sem-hirata.w.waseda.jp/okamoto%20yoshi.pdf"
    check: owner
    note: 巨人戦のナイター中継は2000年代に視聴率が下がり、放送試合数も急に減った（日本テレビ社員の早稲田大学の論文）。ネット配信が主になるのは2010年代後半以降という前提

